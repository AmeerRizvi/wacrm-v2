name: Migrations

# Replays every migration against a clean local Supabase database so schema
# changes are executed rather than only reviewed as SQL text.
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply to a clean database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start Postgres
        run: supabase db start

      - name: Replay every migration from scratch
        run: supabase db reset --local --no-seed

      - name: Verify the resulting schema
        run: supabase db query --local --file supabase/ci/verify-schema.sql
